# docker compose up --build     then open http://127.0.0.1:4811
#
# The licensed data never enters the image; it's mounted at run time:
#   ./data/cache -> /seed (read-only)  your local extract, minimaps and caches (`nunyaintel build-cache`)
#   cache (named volume)               Docker's fast copy of those, made on first start and whenever
#                                      the extract in ./data/cache is newer (docker-entrypoint.sh)
#   STL_DATA_DIR (read-only)           the hackathon GRID data repo (default: next to this project)
# `docker compose down -v` deletes the volume copy; ./data/cache is never changed.
# The port is published on 127.0.0.1 only: the data licence allows local use, not a public server.
services:
  nunyaintel:
    build: .
    image: nunyaintel:local
    container_name: nunyaintel
    ports:
      - "127.0.0.1:4811:4811"
    volumes:
      - ./data/cache:/seed:ro
      - cache:/app/data/cache
      - ${STL_DATA_DIR:-../stl-hackathon-2026-grid-starter}:/data/grid:ro
    restart: unless-stopped

volumes:
  cache:
