[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nunyaintel"
version = "0.1.0"
description = "NunyaIntel: VALORANT tactical scouting, utility placement and Operator profiling (Cloud9 x JetBrains Hackathon 2026, Category 1)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
nunyaintel = "nunyaintel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/nunyaintel/demo.py" = ["E501"]  # long keyword lists building invented rows
